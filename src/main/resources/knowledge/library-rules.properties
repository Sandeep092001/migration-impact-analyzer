knowledge.version=2026.09.26
rules=springdoc-boot3,springdoc-boot4,mybatis-boot3,mybatis-boot4,cloud-aws-boot30,cloud-aws-boot32,cloud-aws-boot34,cloud-aws-boot35,cloud-aws-boot4,mybatis-plus-boot3,mybatis-plus-boot4

rule.springdoc-boot3.group=org.springdoc
rule.springdoc-boot3.artifact=springdoc-openapi*
rule.springdoc-boot3.current=1.
rule.springdoc-boot3.targets=3.0,3.1,3.2,3.3,3.4,3.5
rule.springdoc-boot3.targetArtifact=org.springdoc:springdoc-openapi-starter-webmvc-ui
rule.springdoc-boot3.targetVersion=2.x
rule.springdoc-boot3.status=UPGRADE_REQUIRED
rule.springdoc-boot3.reason=Springdoc 2.x is the supported generation for Spring Boot 3.
rule.springdoc-boot3.evidence=https://springdoc.org/v2/

rule.springdoc-boot4.group=org.springdoc
rule.springdoc-boot4.artifact=springdoc-openapi*
rule.springdoc-boot4.current=1.,2.
rule.springdoc-boot4.targets=4.0,4.1
rule.springdoc-boot4.targetArtifact=org.springdoc:springdoc-openapi-starter-webmvc-ui
rule.springdoc-boot4.targetVersion=3.x
rule.springdoc-boot4.status=UPGRADE_REQUIRED
rule.springdoc-boot4.reason=Springdoc 3.x is the supported generation for Spring Boot 4.
rule.springdoc-boot4.evidence=https://github.com/springdoc/springdoc-openapi

rule.mybatis-boot3.group=org.mybatis.spring.boot
rule.mybatis-boot3.artifact=mybatis-spring-boot-starter
rule.mybatis-boot3.current=1.,2.
rule.mybatis-boot3.targets=3.2,3.3,3.4,3.5
rule.mybatis-boot3.targetArtifact=org.mybatis.spring.boot:mybatis-spring-boot-starter
rule.mybatis-boot3.targetVersion=3.0.x
rule.mybatis-boot3.status=UPGRADE_REQUIRED
rule.mybatis-boot3.reason=The MyBatis starter 3.0 line supports Spring Boot 3.2 through 3.5 and Java 17+.
rule.mybatis-boot3.evidence=https://mybatis.org/spring-boot-starter/mybatis-spring-boot-autoconfigure/

rule.mybatis-boot4.group=org.mybatis.spring.boot
rule.mybatis-boot4.artifact=mybatis-spring-boot-starter
rule.mybatis-boot4.current=1.,2.,3.
rule.mybatis-boot4.targets=4.0
rule.mybatis-boot4.targetArtifact=org.mybatis.spring.boot:mybatis-spring-boot-starter
rule.mybatis-boot4.targetVersion=4.0.x
rule.mybatis-boot4.status=UPGRADE_REQUIRED
rule.mybatis-boot4.reason=The MyBatis starter 4.0 line supports Spring Boot 4.0 and Java 17+.
rule.mybatis-boot4.evidence=https://mybatis.org/spring-boot-starter/mybatis-spring-boot-autoconfigure/

