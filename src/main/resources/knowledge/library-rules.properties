# Framework-independent Java libraries. These rules deliberately do not invent a
# Spring Boot version mapping. They record the library's Java/runtime contract and
# any migration interaction that is documented by the library or Spring Boot.

rule.jjwt-java-library.group=io.jsonwebtoken
rule.jjwt-java-library.artifact=jjwt-api,jjwt-impl,jjwt-jackson,jjwt-gson,jjwt-orgjson
rule.jjwt-java-library.current=0.12.,0.13.
rule.jjwt-java-library.targets=2.0,2.1,2.2,2.3,2.4,2.5,2.6,2.7,3.0,3.1,3.2,3.3,3.4,3.5,4.0,4.1
rule.jjwt-java-library.name=JJWT modules
rule.jjwt-java-library.target=Keep all JJWT modules aligned; 0.13.x is the current documented line
rule.jjwt-java-library.status=COMPATIBLE
rule.jjwt-java-library.risk=MEDIUM
rule.jjwt-java-library.confidence=MEDIUM
rule.jjwt-java-library.java.minimum=8
rule.jjwt-java-library.alignVersions=true
rule.jjwt-java-library.runtimeArtifacts=jjwt-impl,jjwt-jackson,jjwt-gson,jjwt-orgjson
rule.jjwt-java-library.recommendation=Keep every JJWT module on the same version. Declare jjwt-api at compile scope and implementation/JSON modules at runtime scope. On Spring Boot 4, Jackson 2 can coexist with the preferred Jackson 3 stack.
rule.jjwt-java-library.reason=JJWT is a framework-independent Java library. Its official setup documents aligned API, implementation, and JSON modules and supports Java 8+.
rule.jjwt-java-library.evidence=https://github.com/jwtk/jjwt/blob/main/README.adoc

rule.resend-java-preboot4.group=com.resend
