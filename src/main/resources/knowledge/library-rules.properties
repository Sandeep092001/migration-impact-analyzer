rule.resend-java-preboot4.name=Resend Java SDK
rule.resend-java-preboot4.target=Keep the current 4.x line; validate the latest patch independently
rule.resend-java-preboot4.status=COMPATIBLE
rule.resend-java-preboot4.risk=LOW
rule.resend-java-preboot4.confidence=HIGH
rule.resend-java-preboot4.java.minimum=8
rule.resend-java-preboot4.recommendation=No Spring Boot-specific Resend upgrade is required. Keep its Jackson and OkHttp transitive dependencies converged with the application.
rule.resend-java-preboot4.reason=The Resend SDK is compiled for Java 8 and has no Spring Framework dependency.
rule.resend-java-preboot4.evidence=https://github.com/resend/resend-java/blob/main/build.gradle

rule.resend-java-boot4.group=com.resend
rule.resend-java-boot4.artifact=resend-java
rule.resend-java-boot4.current=4.
rule.resend-java-boot4.targets=4.0,4.1
rule.resend-java-boot4.name=Resend Java SDK
rule.resend-java-boot4.target=Keep the current 4.x line; test its Jackson 2 serialization alongside Boot 4
rule.resend-java-boot4.status=COMPATIBLE
rule.resend-java-boot4.risk=MEDIUM
rule.resend-java-boot4.confidence=MEDIUM
rule.resend-java-boot4.java.minimum=8
rule.resend-java-boot4.recommendation=No Spring Boot-specific Resend upgrade is required. Do not force the SDK's Jackson 2 dependencies to Jackson 3; run email payload integration tests after migration.
rule.resend-java-boot4.reason=The Resend SDK is compiled for Java 8 and uses Jackson 2 without a Spring Framework dependency. Spring Boot 4 documents side-by-side Jackson 2 support during migration.
rule.resend-java-boot4.evidence=https://github.com/resend/resend-java/blob/main/build.gradle|https://github.com/spring-projects/spring-boot/wiki/Spring-Boot-4.0-Migration-Guide

